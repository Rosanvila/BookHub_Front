<button class="btn-borrow" type="button"
    [disabled]="loading() || done() || alreadyBorrowed()"
    (click)="borrow()">
    @if (alreadyBorrowed()) {
        Déjà emprunté
    } @else if (done()) {
        Emprunté ✓
    } @else if (loading()) {
        En cours...
    } @else {
        <app-icon name="book" [size]="15" />
        Emprunter ce livre
    }
</button>
@if (errorMsg()) {
<p class="borrow-error">{{ errorMsg() }}</p>
}
